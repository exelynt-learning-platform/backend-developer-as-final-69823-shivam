spring.application.name=booking

# ---- Datasource (override via environment variables) ----
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/bookingdb}
spring.datasource.username=${DB_USER:booking}
spring.datasource.password=${DB_PASS:booking}

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# ---- JWT ----
# JWT_SECRET must be at least 32 bytes for HS256. Override in any real environment.
jwt.secret=${JWT_SECRET:dev-only-secret-change-me-in-production-min-32-bytes}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# ---- OpenAPI / Swagger ----
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
